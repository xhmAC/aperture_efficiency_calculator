<script type="module">const $ = (sel) => document.querySelector(sel);
const example = String.raw`\Gamma=\frac{Z_{\mathrm{in}}-Z_0}{Z_{\mathrm{in}}+Z_0}=|\Gamma|e^{j\varphi}`;
let imageBlob=null,imageURL='',modelReady=false,activeJob=0,recognizing=false;

$('#app').innerHTML = `
<div class="shell">
  <header class="topbar"><div class="brand"><div class="brand-icon">∑</div><div><b>FormulaLab</b><span>Image to Equation</span></div></div><div class="top-right"><span class="privacy"><span class="ico" aria-hidden="true">✓</span> 浏览器本地识别</span><span class="version">v1.2 · 加速版</span></div></header>
  <main>
    <div class="hero"><div class="eyebrow"><span class="dot"></span> AI-POWERED FORMULA RECOGNITION</div><h1>从公式截图，到可编辑的代码</h1><p>粘贴或上传数学公式截图，使用浏览器中的 AI 识别模型生成 LaTeX，并快速复制到 MathType。</p></div>
    <div class="workgrid">
      <section class="panel input-panel"><div class="panel-heading"><div><span class="panel-number">01</span><h2>公式图片</h2></div><button class="text-action" id="clearImage"><span class="ico" aria-hidden="true">↺</span> 清除</button></div>
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="上传公式截图"><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" hidden>
          <div id="emptyUpload" class="upload-empty"><div class="upload-icon"><span class="ico" aria-hidden="true">⇧</span></div><h3>将公式图片拖拽到此处</h3><p>或点击上传、使用 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴截图</p><span class="file-types">PNG · JPG · WEBP · BMP</span></div>
          <div id="imageFrame" class="image-frame hidden"><img id="sourceImage" alt="用户上传的公式截图"><div class="image-foot">原始公式截图</div></div>
        </div>
        <div class="actions"><button class="button secondary" id="uploadBtn"><span class="ico" aria-hidden="true">▣</span> 选择图片</button><button class="button primary" id="recognizeBtn" disabled><span class="ico" aria-hidden="true">✦</span><span>开始识别</span></button></div>
        <div class="setting"><label for="computeMode">推理设备</label><select id="computeMode"><option value="wasm">CPU · 兼容模式（推荐）</option><option value="webgpu">GPU · WebGPU（实验性）</option></select></div>
        <div class="model-tools">
          <div class="tools-head"><strong>模型下载加速</strong><span>可选 · 适合下载很慢时使用</span></div>
          <p>如果你已在浏览器中单独下载过 ONNX 模型，可直接导入，避免网页重新下载大文件。只需选中两个量化模型文件；配置文件继续联网获取。</p>
          <div class="tool-actions"><button class="mini-button" type="button" id="importWeights">📁 导入已下载的 ONNX 文件</button><button class="mini-button" type="button" id="cacheCheck">查看缓存</button></div>
          <input type="file" id="weightInput" accept=".onnx" multiple hidden>
          <div id="localWeightsInfo" class="import-summary">未导入模型文件，将采用网络下载 + 浏览器缓存。</div>
        </div>
        <div id="statusPanel" class="status-panel"><div class="status-line"><span class="status-led" id="statusDot"></span><span id="statusText">模型尚未加载，首次识别需要下载模型</span></div><div class="progress-track hidden" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div><p id="statusHint">首次需要下载约 317 MB 的量化模型；已下载的模型文件也可以通过上方按钮导入。</p></div>
      </section>
      <section class="panel result-panel"><div class="panel-heading"><div><span class="panel-number">02</span><h2>识别结果</h2></div><span class="editable-label"><span></span> 可实时编辑</span></div>
        <div class="result-caption"><span class="ico" aria-hidden="true">∑</span> 公式实时预览</div>
        <div id="formulaPreview" class="formula-preview"><div class="preview-placeholder"><span>∫</span><p>识别完成后，公式将显示在这里</p></div></div>
        <div class="code-label"><span><span class="ico" aria-hidden="true">{}</span> LaTeX 代码</span><button class="mini-button" data-copy="latex"><span class="ico" aria-hidden="true">⧉</span> 复制</button></div>
        <textarea id="latexInput" spellcheck="false" placeholder="识别结果将在此显示；也可以直接输入 LaTeX 进行预览…"></textarea>
        <div class="code-label mathtype-label"><span><span class="ico" aria-hidden="true">≡</span> MathType 兼容输入</span><button class="mini-button" data-copy="mathtype"><span class="ico" aria-hidden="true">⧉</span> 复制</button></div>
        <div class="mathtype-box" id="mathtypeCode">识别后生成可粘贴的 LaTeX 输入文本</div>
        <div class="foot-actions"><button class="button secondary small" id="sampleBtn"><span class="ico" aria-hidden="true">✦</span> 试用示例公式</button><button class="button secondary small" id="saveBtn"><span class="ico" aria-hidden="true">↓</span> 保存 .tex</button></div>
      </section>
    </div>
    <div class="info-grid"><div class="info-card"><div class="info-icon"><span class="ico" aria-hidden="true">✓</span></div><div><b>图片不上传到识别服务器</b><p>模型在你的浏览器中推理；首次需要从模型托管站下载权重。</p></div></div><div class="info-card"><div class="info-icon"><span class="ico" aria-hidden="true">≡</span></div><div><b>MathType 使用说明</b><p>输出的是 MathType 可导入的 LaTeX 文本，并非 MathType 原生二进制格式；需要在 MathType 中通过 LaTeX 输入/转换功能使用。</p></div></div></div>
  </main><footer><span>FormulaLab · Browser AI Math OCR · 下载优化版</span><a href="https://huggingface.co/onnx-community/TexTeller3-ONNX" target="_blank" rel="noopener">模型：TexTeller3-ONNX ↗</a></footer>
</div><div id="toast" class="toast" role="status"></div>`;
function toast(message, isError=false) { const box=$('#toast'); box.textContent=message; box.classList.toggle('error',isError);box.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>box.classList.remove('visible'),3200); }
function setStatus(message, level='neutral', hint) { $('#statusText').textContent=message; $('#statusDot').className='status-led '+level; if(hint!==undefined) $('#statusHint').textContent=hint; }
function setBusy(value) { recognizing=value; $('#recognizeBtn').disabled=value || !imageBlob; $('#recognizeBtn span').textContent=value?'正在识别…':'开始识别'; $('#uploadBtn').disabled=value; $('#computeMode').disabled=value || modelReady; }
function normalizeLatex(s) { return s.trim().replace(/^\$\$([\s\S]*)\$\$$/,'$1').replace(/^\$([\s\S]*)\$$/,'$1').replace(/^\\\[([\s\S]*)\\\]$/,'$1').replace(/^\\\(([\s\S]*)\\\)$/,'$1').trim(); }
function render() { let latex=normalizeLatex($('#latexInput').value); $('#mathtypeCode').textContent=latex||'识别后生成可粘贴的 LaTeX 输入文本'; const target=$('#formulaPreview'); if(!latex) { target.innerHTML='<div class="preview-placeholder"><span>∫</span><p>识别完成后，公式将显示在这里</p></div>';return; }try { katex.render(latex,target,{displayMode:true,throwOnError:true,strict:'ignore',trust:false, maxExpand:1000}); target.classList.remove('render-error'); } catch(error) {target.textContent='公式暂时无法渲染：'+error.message; target.classList.add('render-error');}}
$('#latexInput').addEventListener('input',render);
function acceptImage(file) { if(!file || !file.type.startsWith('image/')) { toast('请选择有效的图片文件（PNG/JPG/WEBP 等）',true);return; }if(file.size>20*1024*1024){toast('图片请小于 20 MB',true);return;} if(imageURL) URL.revokeObjectURL(imageURL); imageBlob=file;imageURL=URL.createObjectURL(file);$('#sourceImage').src=imageURL;$('#emptyUpload').classList.add('hidden');$('#imageFrame').classList.remove('hidden');$('#recognizeBtn').disabled=recognizing;toast('公式图片已载入，可开始识别'); }
$('#uploadBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{acceptImage(e.target.files[0]);e.target.value='';};
$('#dropzone').onclick=()=>{if(!imageBlob)$('#fileInput').click();};$('#dropzone').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!imageBlob){e.preventDefault();$('#fileInput').click();}};
$('#clearImage').onclick=()=>{imageBlob=null;if(imageURL)URL.revokeObjectURL(imageURL);imageURL='';$('#sourceImage').removeAttribute('src');$('#imageFrame').classList.add('hidden');$('#emptyUpload').classList.remove('hidden');$('#recognizeBtn').disabled=true;};
for (const name of ['dragenter','dragover']) $('#dropzone').addEventListener(name,e=>{e.preventDefault();$('#dropzone').classList.add('drag-over');});
for (const name of ['dragleave','drop']) $('#dropzone').addEventListener(name,e=>{e.preventDefault();$('#dropzone').classList.remove('drag-over');});
$('#dropzone').addEventListener('drop',e=>acceptImage(Array.from(e.dataTransfer.files).find(f=>f.type.startsWith('image/'))));
document.addEventListener('paste',e=>{const item=Array.from(e.clipboardData?.items||[]).find(i=>i.type.startsWith('image/'));if(item){e.preventDefault();acceptImage(item.getAsFile());}});
let recognizerPromise = null;
// 用户手动选择的两个量化权重，按原始文件名匹配；只在本次网页会话中持有 File 对象。
const localWeights = new Map();
const WEIGHTS = ['encoder_model_quantized.onnx', 'decoder_model_merged_quantized.onnx'];
$('#importWeights').onclick = () => $('#weightInput').click();
$('#weightInput').addEventListener('change', e => {
  if (recognizerPromise || modelReady) { toast('模型已经开始加载，请刷新页面后再导入', true); return; }
  let added = 0;
  for (const f of e.target.files) {
    if (!WEIGHTS.includes(f.name)) continue;
    if (f.size < 1024 * 1024) {toast('文件体积异常：' + f.name, true);continue;}
    localWeights.set(f.name, f); added++;
  }
  const names = WEIGHTS.filter(n => localWeights.has(n));
  $('#localWeightsInfo').textContent = names.length ? `已导入 ${names.length}/2 个模型文件：${names.join('、')}。${names.length === 2 ? '可以开始识别。' : '尚缺少另一个模型文件。'}` : '没有识别到目标 ONNX 文件，请检查下载的文件名。';
  $('#localWeightsInfo').classList.toggle('success', names.length===2);
  toast(added ? `已导入 ${added} 个模型文件` : '未找到匹配的模型文件', !added);
});
$('#cacheCheck').onclick = async () => {
  try {
    if (!('caches' in window)) throw new Error('浏览器不支持 Cache Storage');
    const keys = await caches.keys();
    const matches = [];
    for (const name of keys) {
      if (!name.includes('transformers')) continue;
      const c = await caches.open(name);
      const reqs = await c.keys();
      matches.push(...reqs.filter(r => r.url.includes('TexTeller3-ONNX')).map(r => r.url.split('/').pop()));
    }
    const info = await navigator.storage?.estimate?.();
    const used = info?.usage != null ? `，当前站点占用约 ${(info.usage/1048576).toFixed(1)} MB` : '';
    toast(`已缓存 ${matches.length} 个相关资源${used}`);
    $('#localWeightsInfo').textContent = `缓存中：${matches.length ? matches.join('、') : '未发现已完整缓存的模型资源'}${used}。`;
  } catch (err) {toast('缓存检查失败：' + err.message, true);}
};
// 每个 ONNX 资源有自己独立的下载进度。不能将每次回调的百分比当作总进度。
const modelDownloads = new Map();
function showModelProgress(p) {
  const filename = String(p.file || p.name || '模型资源');
  const fileLabel = filename.split('/').pop();
  if (p.status === 'initiate') {
    if (!modelDownloads.has(filename)) modelDownloads.set(filename, {loaded:0,total:0,done:false});
  } else if (p.status === 'progress') {
    const old = modelDownloads.get(filename) || {loaded:0,total:0,done:false};
    const total = Number(p.total) || old.total || 0;
    const loaded = Number(p.loaded) || (total && Number.isFinite(p.progress) ? total*p.progress/100 : old.loaded);
    modelDownloads.set(filename,{loaded,total,done:false});
  } else if (p.status === 'done' || p.status === 'ready') {
    const old = modelDownloads.get(filename) || {loaded:0,total:0,done:false};
    modelDownloads.set(filename,{loaded:old.total||old.loaded,total:old.total,done:true});
  }
  const entries = [...modelDownloads.entries()];
  const complete = entries.filter(([,v])=>v.done).length;
  const active = [...entries].reverse().find(([,v])=>!v.done && v.loaded>0);
  const name = active ? active[0].split('/').pop() : fileLabel;
  const v = active ? active[1] : modelDownloads.get(filename);
  const mb = n => (n/1048576).toFixed(1);
  const currentPercent = v?.total ? Math.min(100,100*v.loaded/v.total) : (Number.isFinite(p.progress)?p.progress:null);
  // 这根进度条仅代表当前文件，不代表全部模型文件。
  $('#progressFill').style.width = currentPercent == null ? '0%' : Math.max(0,currentPercent)+'%';
  const sizeInfo = v?.total ? `${mb(v.loaded)} / ${mb(v.total)} MB` : (v?.loaded ? `${mb(v.loaded)} MB` : '等待下载');
  if(active || p.status==='progress') {
    setStatus(`下载文件：${name}`, 'working', `${sizeInfo} · 已完成 ${complete} 个资源。进度条只表示当前文件，不是总体进度。`);
  } else {
    setStatus(`正在准备模型资源（已完成 ${complete} 个文件）`,'working',
      '多个模型文件会分别下载。完成下载后仍需进行模型初始化。');
  }
}

async function loadModel() {
 if(recognizerPromise)return recognizerPromise;
 const selected=$('#computeMode').value;
 const device=selected==='webgpu'&&('gpu' in navigator)?'webgpu':'wasm';
 $('#progressTrack').classList.remove('hidden');
 setStatus('正在连接 TexTeller3 模型资源…','working','将优先从浏览器缓存或你导入的文件中加载模型，缺失文件再联网获取。');
 recognizerPromise=(async()=>{
   const {pipeline,env}=await import('https://esm.sh/@huggingface/transformers@3.7.2');
   env.allowRemoteModels=true;
   env.useBrowserCache=true;
   env.useWasmCache=true;
   env.allowLocalModels=false;
   // 这里保留 Transformers.js 默认的缓存键，以便复用旧版已成功下载的模型。
   // 从本地文件流提供权重，其他配置文件及缺失权重仍走官方服务器。
   const baseFetch = globalThis.fetch.bind(globalThis);
   env.fetch = async (input, init) => {
     const raw = typeof input === 'string' ? input : input?.url;
     const url = String(raw || '');
     const basename = url.split('?')[0].split('/').pop();
     if (url.includes('/TexTeller3-ONNX/') && localWeights.has(basename)) {
       const file = localWeights.get(basename);
       return new Response(file.stream(), {status:200, headers:{'Content-Type':'application/octet-stream', 'Content-Length':String(file.size)}});
     }
     // 仅重试连接失败，不重试 404/403 等 HTTP 错误；失败后已缓存的文件不会丢失。
     for (let attempt=0; attempt<3; attempt++) {
       try {return await baseFetch(input, init);} catch (error) {
         if (init?.signal?.aborted || attempt===2) throw error;
         setStatus('模型资源连接中断，正在重试…', 'working', `网络请求失败，正在执行第 ${attempt+1} 次重试；已缓存的文件会保留。`);
         await new Promise(resolve=>setTimeout(resolve,800 * (attempt+1)));
       }
     }
   };
   if (navigator.storage?.persist) {try {await navigator.storage.persist();}catch{}}
   const make=async d=>pipeline('image-to-text','onnx-community/TexTeller3-ONNX',{
     device:d,dtype:d==='webgpu'?'fp16':'q8',
     progress_callback:showModelProgress
   });
   let pipe;
   try{pipe=await make(device);}catch(e){if(device!=='webgpu')throw e;toast('GPU 模式不可用，正在尝试 CPU 模式');pipe=await make('wasm');}
   modelReady=true;$('#computeMode').disabled=true;$('#progressTrack').classList.add('hidden');
   setStatus('模型已就绪','ready','识别在浏览器内完成。');
   return pipe;
 })().catch(e=>{recognizerPromise=null;$('#progressTrack').classList.add('hidden');throw e;});
 return recognizerPromise;
}
function readAsDataURL(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);});}
$('#recognizeBtn').onclick=async()=>{
 if(!imageBlob||recognizing)return;
 setBusy(true);$('#progressFill').style.width='0%';const id=++activeJob;
 try{
  const pipe=await loadModel();
  setStatus('正在处理图片…','working','正在转换为模型要求的单通道灰度图。');
  // TexTeller3 的预处理配置：num_channels=1, image_mean/std 各仅 1 项。
  // 不能直接传入 PNG/JPG 的 RGBA(4) 图像，否则会触发通道数不匹配。
  const {RawImage}=await import('https://esm.sh/@huggingface/transformers@3.7.2');
  const grayImage=(await RawImage.read(imageBlob)).grayscale();
  if(grayImage.channels!==1)throw new Error('图片预处理失败：模型需要单通道灰度图');
  setStatus('正在识别公式…','working','图片已转换为灰度图，正在执行模型推理。');
  const result=await pipe(grayImage,{max_new_tokens:512});
  if(id!==activeJob)return;
  const latex=Array.isArray(result)?result[0]?.generated_text:result?.generated_text;
  if(!latex||typeof latex!=='string')throw new Error('模型没有返回有效公式');
  $('#latexInput').value=normalizeLatex(latex);render();
  setStatus('识别完成 · 可核对并修改','ready','请注意检查上下标、括号和符号。');toast('识别完成');
 }catch(e){setStatus('识别失败','bad',String(e?.message||e)+( /network|fetch|http|cdn/i.test(String(e?.message||e))?'。若为网络错误，可导入已下载的 ONNX 文件。':'。请检查公式截图是否清晰，必要时尝试更换图片。'));toast('识别失败：'+String(e?.message||e),true);}
 finally{setBusy(false);}
};
$('#sampleBtn').onclick=()=>{$('#latexInput').value=example;render();toast('示例公式已填入，可直接编辑');};
async function copyValue(value){try{await navigator.clipboard.writeText(value);toast('已复制到剪贴板');}catch{const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'已复制到剪贴板':'复制失败，请手动选择文本',!ok);}}
document.querySelectorAll('[data-copy]').forEach(btn=>btn.onclick=()=>{const val=normalizeLatex($('#latexInput').value);if(!val){toast('请先识别或输入公式',true);return;}copyValue(val);});
$('#saveBtn').onclick=()=>{const code=normalizeLatex($('#latexInput').value);if(!code){toast('请先识别或输入公式',true);return;}const blob=new Blob([`\\[\n${code}\n\\]\n`],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='formula.tex';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
render();
