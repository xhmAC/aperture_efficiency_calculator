// Only strip display delimiters at the boundary. Preserve actual equation content.
function normalizeLatex(s) {
  return String(s??'').trim()
    .replace(/^\s*\$\$([\s\S]*?)\$\$\s*$/,'$1')
    .replace(/^\s*\$([\s\S]*?)\$\s*$/,'$1')
    .trim();
}
// Split multiple display math blocks (OCR sometimes emits \\] \\[ between two equations).
function splitFormulas(s) {
  let text=normalizeLatex(s).replace(/\r/g,'').replace(/\\\]\s*\\\[/g,'\n@@SPLIT@@\n');
  text=text.replace(/\\\[|\\\]/g,'');
  text=text.replace(/\$\$\s*\$\$/g,'\n@@SPLIT@@\n');
  return text.split(/@@SPLIT@@|\n\s*\n/).map(x=>x.trim()).filter(Boolean);
}
// Safe structural repairs only: this cannot correct semantic hallucinations from OCR.
function repairFormulaFragment(s) {
  let x=s.trim();let changes=[];
  const old=x;
  x=x.replace(/\\(?:bm|mathbf)\s*\{(10|e)\}/g,'$1');
  if(x!==old)changes.push('移除套在数字或指数底数上的不必要粗体');
  let out='',depth=0,removed=0;
  for(let i=0;i<x.length;i++){
    const c=x[i];
    if(c==='\\' && i+1<x.length){out+=c+x[++i];continue;}
    if(c==='{'){depth++;out+=c;}
    else if(c==='}') {if(depth>0){depth--;out+=c;}else removed++;}
    else out+=c;

function showModelProgress(p) {
  const filename = String(p.file || p.name || '模型资源');
  const fileLabel = filename.split('/').pop();
  if (p.status === 'initiate') {
    if (!modelDownloads.has(filename)) modelDownloads.set(filename, {loaded:0,total:0,done:false});
  } else if (p.status === 'progress') {
    const old = modelDownloads.get(filename) || {loaded:0,total:0,done:false};
    const total = Number(p.total) || old.total || 0;
    const loaded = Number(p.loaded) || (total && Number.isFinite(p.progress) ? total*p.progress/100 : old.loaded);
    modelDownloads.set(filename,{loaded,total,done:false});
  } else if (p.status === 'done' || p.status === 'ready') {
    const old = modelDownloads.get(filename) || {loaded:0,total:0,done:false};
    modelDownloads.set(filename,{loaded:old.total||old.loaded,total:old.total,done:true});
  }
  const entries = [...modelDownloads.entries()];
  const complete = entries.filter(([,v])=>v.done).length;
  const active = [...entries].reverse().find(([,v])=>!v.done && v.loaded>0);
  const name = active ? active[0].split('/').pop() : fileLabel;
  const v = active ? active[1] : modelDownloads.get(filename);
  const mb = n => (n/1048576).toFixed(1);
  const currentPercent = v?.total ? Math.min(100,100*v.loaded/v.total) : (Number.isFinite(p.progress)?p.progress:null);
  // 这根进度条仅代表当前文件，不代表全部模型文件。
  $('#progressFill').style.width = currentPercent == null ? '0%' : Math.max(0,currentPercent)+'%';
  const sizeInfo = v?.total ? `${mb(v.loaded)} / ${mb(v.total)} MB` : (v?.loaded ? `${mb(v.loaded)} MB` : '等待下载');
  if(active || p.status==='progress') {
    setStatus(`下载文件：${name}`, 'working', `${sizeInfo} · 已完成 ${complete} 个资源。进度条只表示当前文件，不是总体进度。`);
  } else {
    setStatus(`正在准备模型资源（已完成 ${complete} 个文件）`,'working',
      '多个模型文件会分别下载。完成下载后仍需进行模型初始化。');
  }
}

  $('#rawModelOutput').value=latex;
  const fixed=repairLatex(latex);
  // OCR may hallucinate \boxed when it sees an image frame. Only remove an
  // *outermost* wrapper if we actually detected and cropped a visible frame.
  if(processed.frameDetected){
    const trimmed=fixed.code.trim();
    if(trimmed.startsWith('\\boxed{')){
      let depth=1,end=-1;
      for(let k=7;k<trimmed.length;k++){
        if(trimmed[k]==='{')depth++;
        else if(trimmed[k]==='}'&&!--depth){end=k;break;}
      }
      if(end===trimmed.length-1){fixed.code=trimmed.slice(7,-1);fixed.notes.push('移除由外框引起的最外层 boxed 命令');}
    }
  }
  $('#latexInput').value=fixed.code;render();
  if(fixed.notes.length)toast('已修复部分 LaTeX 结构问题，请核对公式');
  const suspicious=/(?:Z_\{?\mathrm\{in\}\}?){2}|\\mathbbf|\\mathbf\{[A-Za-z]\}\\mathbf/.test(fixed.code);
  if(suspicious)toast('检测到疑似重复符号；语法可渲染不代表识别正确，请核对原图',true);
  setStatus('识别完成 · 请与原图核对','ready','如仍有明显错误，可尝试强制反色或不反色再次识别；量化模型可能存在准确率限制。');toast('识别完成');
 }catch(e){setStatus('识别失败','bad',String(e?.message||e)+( /network|fetch|http|cdn/i.test(String(e?.message||e))?'。若为网络错误，可导入已下载的 ONNX 文件。':'。请检查公式截图是否清晰，必要时尝试更换图片。'));toast('识别失败：'+String(e?.message||e),true);}
 finally{setBusy(false);}
};
const screenshotExample=String.raw`\widetilde{\mathbf{E}}_{\theta}=\sqrt{10^{G_{\theta}^{\mathrm{dBi}}/10}}\,e^{j\psi_{\theta}}

\widetilde{\mathbf{E}}_{\varphi}=\sqrt{10^{G_{\varphi}^{\mathrm{dBi}}/10}}\,e^{j\psi_{\varphi}}`;
$('#imageExampleBtn').onclick=()=>{$('#latexInput').value=screenshotExample;render();toast('已载入截图中的正确公式，可测试预览与复制');};
$('#repairBtn').onclick=()=>{const original=$('#latexInput').value;if(!original.trim()){toast('请先识别或输入公式',true);return;}const fixed=repairLatex(original);$('#latexInput').value=fixed.code;render();toast(fixed.notes.length?'已做语法修复，请对照原图检查':'未发现可安全自动修复的结构错误');};
$('#sampleBtn').onclick=()=>{$('#latexInput').value=example;render();toast('示例公式已填入，可直接编辑');};
async function copyValue(value){try{await navigator.clipboard.writeText(value);toast('已复制到剪贴板');}catch{const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'已复制到剪贴板':'复制失败，请手动选择文本',!ok);}}
document.querySelectorAll('[data-copy]').forEach(btn=>btn.onclick=()=>{const latex=normalizeLatex($('#latexInput').value);if(!latex){toast('请先识别或输入公式',true);return;}const mode=btn.dataset.copy;const mt=toMathType7(latex).code;if(mode!=='latex' && splitFormulas(latex).length>1)toast('检测到多条公式：MathType 7 建议每次粘贴一条',true);copyValue(mode==='latex'?latex:mode==='mathtype-wrapped'?'$'+mt+'$':mt);});
$('#saveBtn').onclick=()=>{const code=normalizeLatex($('#latexInput').value);if(!code){toast('请先识别或输入公式',true);return;}const blob=new Blob([`\\[\n${code}\n\\]\n`],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='formula.tex';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
